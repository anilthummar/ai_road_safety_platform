name: ai_road_safety_platform
description: >
  AI Road Safety Platform — production Flutter client for flooded road
  and hidden hazard detection research using artificial intelligence.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter_skill: ^0.2.6
  flutter:
    sdk: flutter

  # State management (ONLY flutter_bloc — no Provider / GetX / Riverpod)
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency injection
  get_it: ^8.0.3

  # Navigation
  go_router: ^15.1.2

  # Logging
  logger: ^2.5.0

  # Networking (foundation; no feature endpoints yet)
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # Local persistence (theme + future settings)
  shared_preferences: ^2.5.3

  # Icons
  cupertino_icons: ^1.0.8
  camera: ^0.12.0+2
  permission_handler: ^12.0.3
  tflite_flutter: ^0.12.1
  image: ^4.8.0
  geolocator: ^14.0.3
  sensors_plus: ^7.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  uuid: ^4.5.3
  share_plus: ^13.2.0
  fl_chart: ^1.2.0
  archive: ^4.0.9
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/models/
    - assets/labels/
